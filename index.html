<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <title>Tic Tac Toe</title>
    </head>
    <body>
        <p>Öffne die Konsole (F12), um die Ausgabe zu sehen.</p>
        <script>
            // ===== Grundidee: Eine Funktion = eine Aufgabe =====
            // Wir bauen das Spiel Schritt für Schritt auf.
            // Heute lernen wir die ersten zwei Bausteine.

            // Schritt 1: Daten erzeugen
            // Diese Funktion erstellt ein leeres Spielfeld: 9 leere Felder.
            // Sie macht NICHTS anderes – sie gibt die Daten mit "return" zurück.
            function erstelleFeld() {
                return [" ", " ", " ", " ", " ", " ", " ", " ", " "];
            }

            // Schritt 2: Daten anzeigen
            // Diese Funktion zeigt ein Spielfeld in der Konsole an.
            // Auch sie hat nur eine Aufgabe: anzeigen (sie verändert nichts).
            function zeigeFeld(feld) {
                // \n bedeutet "neue Zeile". So wird alles EIN String und Chrome
                // baut keine Lücken zwischen mehreren console.log-Aufrufen ein.
                console.log(
                    " " +
                        feld[0] +
                        " | " +
                        feld[1] +
                        " | " +
                        feld[2] +
                        "\n" +
                        "---+---+---\n" +
                        " " +
                        feld[3] +
                        " | " +
                        feld[4] +
                        " | " +
                        feld[5] +
                        "\n" +
                        "---+---+---\n" +
                        " " +
                        feld[6] +
                        " | " +
                        feld[7] +
                        " | " +
                        feld[8],
                );
            }

            // Schritt 3: Daten verändern
            // Diese Funktion setzt einen Stein ("X" oder "O") auf ein Feld.
            // index ist die Position 0-8, spieler ist "X" oder "O".
            function setzeStein(feld, index, spieler) {
                feld[index] = spieler;
            }

            // Schritt 4: Daten prüfen
            // Diese Funktion prüft, ob ein Spieler ("X" oder "O") gewonnen hat.
            // Es gibt 8 Möglichkeiten zu gewinnen: 3 Reihen, 3 Spalten, 2 Diagonalen.
            // Jede Linie ist eine Liste von drei Positionen (0-8).
            function hatGewonnen(feld, spieler) {
                let linien = [
                    [0, 1, 2], // obere Reihe
                    [3, 4, 5], // mittlere Reihe
                    [6, 7, 8], // untere Reihe
                    [0, 3, 6], // linke Spalte
                    [1, 4, 7], // mittlere Spalte
                    [2, 5, 8], // rechte Spalte
                    [0, 4, 8], // Diagonale \
                    [2, 4, 6], // Diagonale /
                ];

                // Wir schauen jede Linie an. Gehören alle drei Felder dem Spieler,
                // dann hat er gewonnen -> true zurückgeben.
                for (let linie of linien) {
                    if (
                        feld[linie[0]] === spieler &&
                        feld[linie[1]] === spieler &&
                        feld[linie[2]] === spieler
                    ) {
                        return true;
                    }
                }

                // Keine Linie passt -> der Spieler hat (noch) nicht gewonnen.
                return false;
            }

            // Schritt 5: zwischen den Spielern wechseln
            // Ist gerade "X" dran, gibt die Funktion "O" zurück – und umgekehrt.
            // So müssen wir uns im Hauptteil nicht selbst merken, wer dran ist.
            function wechsleSpieler(spieler) {
                if (spieler === "X") {
                    return "O";
                } else {
                    return "X";
                }
            }

            // Schritt 6: prüfen, ob ein Feld noch frei ist
            // Frei bedeutet: dort steht ein Leerzeichen, noch kein "X" oder "O".
            function istFrei(feld, index) {
                return feld[index] === " ";
            }

            // Schritt 7: prüfen, ob das Feld voll ist
            // includes(" ") ist true, solange noch ein Leerzeichen übrig ist.
            // Mit ! drehen wir das um: voll = KEIN Leerzeichen mehr übrig.
            function istVoll(feld) {
                return !feld.includes(" ");
            }

            // Schritt 8: einen gültigen Zug vom Spieler holen
            // prompt() fragt den Menschen nach einer Zahl. Wir fragen so lange
            // nach, bis die Eingabe gültig (1-9) und das Feld noch frei ist.
            function holeZug(feld, spieler) {
                while (true) {
                    let eingabe = prompt(
                        "Spieler " + spieler + ", waehle ein Feld (1-9):",
                    );
                    let index = Number(eingabe) - 1; // Mensch zählt 1-9, Array 0-8
                    if (index >= 0 && index <= 8 && istFrei(feld, index)) {
                        return index;
                    }
                    console.log("Ungueltiger Zug, versuche es nochmal.");
                }
            }

            // Schritt 9: alle Bausteine zu einem echten Spiel zusammensetzen
            // Hier sieht man, wofür wir die kleinen Funktionen gebaut haben.
            function spiele() {
                let feld = erstelleFeld(); // Schritt 1: leeres Feld
                let spieler = "X"; // X fängt an
                zeigeFeld(feld); // Schritt 2: Startfeld zeigen

                // Die Schleife läuft, bis jemand gewinnt oder das Feld voll ist.
                while (true) {
                    let index = holeZug(feld, spieler); // Schritt 8: Eingabe holen
                    setzeStein(feld, index, spieler); // Schritt 3: Stein setzen
                    zeigeFeld(feld); // Schritt 2: neues Feld zeigen

                    if (hatGewonnen(feld, spieler)) {
                        // Schritt 4
                        console.log("Spieler " + spieler + " gewinnt!");
                        break; // Schleife verlassen -> Spiel zu Ende
                    }
                    if (istVoll(feld)) {
                        // Schritt 7
                        console.log("Unentschieden!");
                        break;
                    }
                    spieler = wechsleSpieler(spieler); // Schritt 5: anderer ist dran
                }
            }

            // ===== Hauptteil: das Spiel starten =====
            // Ein einziger Aufruf – die ganze Logik steckt in den Funktionen.
            spiele();
        </script>
    </body>
</html>
